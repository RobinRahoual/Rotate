# Publie une Release GitHub avec le fichier d'installation Rotate-<version>.ccx
# à chaque tag « v… » (ex. v0.7.0). Le paquet n'est publié que si les tests passent.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Version de ffmpeg prête à l'emploi (téléchargement direct, bien plus rapide et fiable qu'apt).
      - name: Installer ffmpeg (tests)
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -version | head -1

      - name: Tests
        run: npm test

      - name: Fabriquer le paquet .ccx
        id: package
        run: |
          npm run -s package
          VERSION=$(node -p "require('./plugin/manifest.json').version")
          # Pack d'installation : le .ccx + les scripts d'installation de secours + le mode d'emploi.
          BUNDLE_DIR="$RUNNER_TEMP/Rotate-$VERSION"
          mkdir -p "$BUNDLE_DIR"
          cp "dist/Rotate-$VERSION.ccx" install/* "$BUNDLE_DIR/"
          (cd "$RUNNER_TEMP" && zip -X -q -r "$GITHUB_WORKSPACE/dist/Rotate-$VERSION-installation.zip" "Rotate-$VERSION")
          unzip -l "dist/Rotate-$VERSION-installation.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=dist/Rotate-$VERSION.ccx" >> "$GITHUB_OUTPUT"
          echo "bundle=dist/Rotate-$VERSION-installation.zip" >> "$GITHUB_OUTPUT"

      - name: Vérifier que le tag correspond à la version du plugin
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.package.outputs.version }}" ]; then
            echo "Le tag ${GITHUB_REF_NAME} ne correspond pas à la version du manifeste (v${{ steps.package.outputs.version }})."
            exit 1
          fi

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          FILE: ${{ steps.package.outputs.file }}
          BUNDLE: ${{ steps.package.outputs.bundle }}
        run: |
          TAG="v$VERSION"
          NOTES=$(cat <<'EOF'
          ## Installer Rotate

          1. Télécharge **Rotate-VERSION.ccx** ci-dessous (section *Assets*).
          2. Double-clique dessus : l'application Creative Cloud l'installe (clique sur *Installer* à l'avertissement « plugin hors Marketplace »).
          3. Dans Premiere Pro (25.6 ou plus récent) : *Fenêtre > Plugins UXP > Rotate*.

          **Le double-clic ne fait rien ?** Télécharge plutôt **Rotate-VERSION-installation.zip**, décompresse-le, puis :
          - Windows : double-clique sur *Installer Rotate (Windows).bat* (si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* > *Exécuter quand même*) ;
          - Mac : clic droit sur *Installer Rotate (Mac).command* > *Ouvrir*.

          Le script lance l'installeur officiel d'Adobe et affiche le message d'erreur exact en cas de problème.

          Pour mettre à jour : désinstalle l'ancienne version (Creative Cloud > *Gérer les plugins*) puis installe la nouvelle.

          Plugin gratuit par [@robin.rahoual](https://www.instagram.com/robin.rahoual/) sur Instagram.
          EOF
          )
          NOTES="${NOTES//VERSION/$VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" "$BUNDLE" --clobber
          else
            gh release create "$TAG" "$FILE" "$BUNDLE" --title "Rotate $VERSION" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
